name: API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: finance_test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: test_root_password

        ports:
          - 3307:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      MYSQL_PORT: 3307
      MYSQL_DATABASE: finance_test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Grant execution permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test